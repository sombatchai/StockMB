<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMB | ข้อมูลสถิติสินค้าทั้งหมด</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../style/onlyproduct.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* สไตล์สำหรับการแสดงผลแบบแถวแนวนอนที่เลื่อนดูได้ต่อเนื่อง */
        .product-stat-row {
            display: grid;
            grid-template-columns: 250px 1fr 280px;
            gap: 20px;
            padding: 25px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            align-items: center;
            transition: transform 0.2s;
        }
        .product-stat-row:hover { transform: translateY(-5px); }
        .product-info-section { text-align: center; border-right: 1px solid #f0f0f0; padding-right: 20px; }
        .product-info-section img { border-radius: 15px; margin-bottom: 15px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #eee; }
        .chart-section { height: 250px; min-width: 0; padding: 0 20px; }
        .badges-section { display: flex; flex-direction: column; gap: 12px; padding-left: 20px; border-left: 1px solid #f0f0f0; }
        .badge-stat { padding: 12px; border-radius: 10px; color: white; font-size: 14px; text-align: center; font-weight: 500; }
        .stock-tag { background: #2ecc71; color: white; padding: 10px; border-radius: 10px; margin-top: 10px; font-weight: bold; }
        #all-stats-container { padding: 10px 20px 50px 20px; }
        
        /* ตกแต่งส่วน Filter หมวดหมู่ให้เหมือนในรูปภาพ */
        .category-select {
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #ddd;
            font-family: 'Kanit', sans-serif;
            outline: none;
            min-width: 180px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <main class="content-wrapper">
        <div class="top-row">
            <div class="nav-controls">
                <button class="btn-back" onclick="history.back()">↩️ ย้อนกลับ</button>
            </div>
        </div>

        

        <div class="header-section">
            <h1>ข้อมูลสถิติสินค้าทั้งหมด</h1>
            <div class="search-bar-container">
                <div class="search-pill">
                    <input type="text" id="searchInput" placeholder="ค้นหาชื่อสินค้าหรือรหัส...">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                </div>
                <select class="category-select" id="categoryFilter">
                    <option value="">หมวดหมู่ทั้งหมด</option>
                </select>
            </div>
        </div>

        <div id="all-stats-container">
            <p style="text-align:center; padding:50px; color:#888;">กำลังโหลดข้อมูลสถิติสินค้าทั้งหมด...</p>
        </div>
    </main>

    <script>
        const { ipcRenderer } = require('electron');
        const charts = {}; 
        let allProductsData = []; 

        document.addEventListener('DOMContentLoaded', () => {
            ipcRenderer.send('get-all-product-list');
            // เรียกข้อมูลหมวดหมู่ทั้งหมดมาแสดง
            ipcRenderer.send('get-categories');
        });

        //  1. จัดการข้อมูลหมวดหมู่สินค้า
        ipcRenderer.on('render-categories', (event, categories) => {
            const select = document.getElementById('categoryFilter');
            select.innerHTML = '<option value="">หมวดหมู่ทั้งหมด</option>';
            categories.forEach(cat => {
                if (cat.pro_category) {
                    const option = document.createElement('option');
                    option.value = cat.pro_category;
                    option.textContent = cat.pro_category;
                    select.appendChild(option);
                }
            });
        });

        ipcRenderer.on('render-product-list', (event, products) => {
            allProductsData = products; 
            displayFilteredProducts(products); 
        });

        //  2. ฟังก์ชันรวมสำหรับกรองข้อมูล (ชื่อ/รหัส และ หมวดหมู่)
        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const category = document.getElementById('categoryFilter').value;

            const filtered = allProductsData.filter(p => {
                const matchesSearch = p.product_name.toLowerCase().includes(searchTerm) || 
                                      p.product_id.toString().includes(searchTerm);
                const matchesCategory = category === "" || p.pro_category === category;
                return matchesSearch && matchesCategory;
            });
            displayFilteredProducts(filtered); 
        }

        // ผูกเหตุการณ์การกรองข้อมูล
        document.getElementById('categoryFilter').addEventListener('change', filterProducts);
        document.getElementById('searchInput').addEventListener('input', filterProducts);
        document.addEventListener('DOMContentLoaded', () => {
        // ดึงชื่อพนักงานที่ถูกบันทึกไว้ตั้งแต่หน้า Login
        const name = localStorage.getItem('employeeName');

        if (name) {
            // หากพบชื่อ ให้ส่งไปแสดงผลที่ id="display-staff-name"
            const nameElement = document.getElementById('display-staff-name');
            if (nameElement) {
                nameElement.innerText = name;
            }
        } else {
            // ระบบความปลอดภัย: หากแอบเข้าหน้าอื่นโดยไม่ผ่านการ Login ให้เด้งกลับไปหน้าแรก
            window.location.href = 'login.html';
        }
    });
        function displayFilteredProducts(products) {
            const container = document.getElementById('all-stats-container');
            container.innerHTML = ''; 

            if (!products || products.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#999;">ไม่พบสินค้าที่ตรงตามเงื่อนไข</p>';
                return;
            }

            products.forEach(product => {
                const id = product.product_id;
                const rowHTML = `
                    <div class="product-stat-row">
                        <div class="product-info-section">
                            <img src="${product.image || 'https://via.placeholder.com/120'}" width="120" height="120">
                            <h3>${product.product_name}</h3>
                            <p style="color:#888; font-size:13px;">รหัส: ${id}</p>
                            <p style="font-size:13px; color:#333; margin-top:5px; font-weight:500;">
                                ราคาต่อชิ้น: ${product.price ? product.price.toLocaleString() : 0} บาท
                            </p>
                            <div class="stock-tag" id="stock-${id}">คงเหลือ: -</div>
                        </div>
                        <div class="chart-section"><canvas id="chart-${id}"></canvas></div>
                        <div class="badges-section">
                            <div class="badge-stat bg-darkblue" id="sales-qty-${id}">ขายออกสะสม: -</div>
                            <div class="badge-stat bg-cyan" id="import-qty-${id}">นำเข้าสะสม: -</div>
                            <div class="badge-stat bg-green" id="revenue-${id}">รายได้: ฿-</div>
                            <div class="badge-stat bg-red" id="expenses-${id}">รายจ่าย: ฿-</div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', rowHTML);
                ipcRenderer.send('get-individual-product-stats', id);
                ipcRenderer.send('get-product-graph-data', id);
            });
        }

        ipcRenderer.on('render-individual-product-stats', (event, data) => {
            if (!data) return;
            const id = data.product_id;
            const elements = {
                stock: `stock-${id}`, sales: `sales-qty-${id}`, 
                import: `import-qty-${id}`, rev: `revenue-${id}`, exp: `expenses-${id}`
            };
            Object.entries(elements).forEach(([key, elId]) => {
                const el = document.getElementById(elId);
                if (el) {
                    if (key === 'stock') el.innerText = `คงเหลือ: ${(data.quantity || 0).toLocaleString()}`;
                    else if (key === 'sales') el.innerText = `ขายออกสะสม ${(data.total_sales_qty || 0).toLocaleString()} ชิ้น`;
                    else if (key === 'import') el.innerText = `นำเข้าสะสม ${(data.total_import_qty || 0).toLocaleString()} ชิ้น`;
                    else if (key === 'rev') el.innerText = `รายได้ ฿${(data.total_sales_revenue || 0).toLocaleString()}`;
                    else if (key === 'exp') el.innerText = `รายจ่าย ฿${(data.total_import_cost || 0).toLocaleString()}`;
                }
            });
        });

        ipcRenderer.on('render-product-graph', (event, response) => {
            const id = response.productId; 
            const graphData = response.graphData;
            if (!id || !graphData || !document.getElementById(`chart-${id}`)) return;
            const ctx = document.getElementById(`chart-${id}`).getContext('2d');
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: graphData.map(d => d.date_label || d.date), 
                    datasets: [
                        { label: 'นำเข้า', data: graphData.map(d => d.imports), backgroundColor: '#4fd1ed', borderRadius: 5 },
                        { label: 'ขายออก', data: graphData.map(d => d.sales), backgroundColor: '#1d5a96', borderRadius: 5 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { font: { family: 'Kanit', size: 10 } } } },
                    scales: {
                        y: { beginAtZero: true, ticks: { font: { size: 10 } } },
                        x: { ticks: { font: { size: 10 } } }
                    }
                }
            });
        });

     function logout() {
    localStorage.clear();
    window.location.href = 'Login.html'; 
}


document.addEventListener('DOMContentLoaded', () => {
    const role = localStorage.getItem('employeeRole');
    const sidebar = document.querySelector('.sidebar ul');

    if (role === 'Staff') {
        //  สำหรับพนักงานทั่วไป: ซ่อนเมนูที่ไม่เกี่ยวข้อง
        const adminMenus = document.querySelectorAll('.admin-only');
        adminMenus.forEach(menu => menu.style.display = 'none');
        
        // หากพนักงานพยายามเข้าหน้า index.html (Dashboard) ให้ดีดไปหน้าขายสินค้าทันที
        if (window.location.pathname.includes('index.html')) {
            window.location.href = 'productsales.html';
        }
    }
});

function processExcelFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = new Uint8Array(e.target.result);
            // อ่านไฟล์โดยบังคับให้เป็นอาเรย์
            const workbook = XLSX.read(data, { type: 'array' });
            
            // ดึงชื่อชีทแรกสุดเสมอ ไม่ว่าจะชื่ออะไร
            const firstSheetName = workbook.SheetNames[0];
            const firstSheet = workbook.Sheets[firstSheetName];
            
            // แปลงเป็น JSON และกำหนดค่าเริ่มต้นเพื่อป้องกัน Error บรรทัดว่าง
            const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

            if (jsonData.length === 0) {
                alert("ไม่พบข้อมูลในไฟล์ Excel");
                return;
            }

            // ส่งข้อมูลไปที่ main.js
            ipcRenderer.send('import-products-bulk', jsonData);

            ipcRenderer.once('import-success', (event, count) => {
                alert(` นำเข้าข้อมูลสำเร็จทั้งหมด ${count} รายการ`);
                ipcRenderer.send('load-products'); // รีโหลดตาราง
            });

        } catch (err) {
            console.error("Excel Detail Error:", err);
            // แจ้งเตือนข้อผิดพลาดที่คุณพบ
            alert("เกิดข้อผิดพลาดทางเทคนิค: โปรดตรวจสอบหัวตารางและปิดไฟล์ Excel ก่อนอัปโหลด");
        }
    };
    reader.readAsArrayBuffer(file);
}

function loadData() {
    //  1. ล้างตัวดักฟังเก่าออกให้หมดก่อน 
    ipcRenderer.removeAllListeners('render-employees');
    ipcRenderer.removeAllListeners('render-products');

    //  2. ส่งคำสั่งดึงข้อมูล
    ipcRenderer.send('load-data-request');
}

// เรียกใช้งานเมื่อโหลดหน้า
document.addEventListener('DOMContentLoaded', loadData);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
